<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <title>MyAnimeList Dashboard</title>
  </head>
  <body onload="init()">
    <div class="container">
      <div id="FilterContainer">
        <div id="logo_container">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/58/MyAnimeList_-_Full_Text_Logo.jpg/2560px-MyAnimeList_-_Full_Text_Logo.jpg" width="100%">
        </div>
        <div id="search_box_container">
          <img src="https://static-00.iconduck.com/assets.00/search-icon-2044x2048-psdrpqwp.png" height="35px">
          <input type="text" id="search_box" placeholder="Search for anime...">
        </div>
      </div>
      <div id="ScentedPlot">ScentedPlot</div>
      <div class="graph_container" id="Sunburst">Sunburst</div>
      <div class="graph_container" id="Histogram">Histogram</div>
      <div class="graph_container" id="ScatterPlot"></div>
    </div>
  </body>
</html>
