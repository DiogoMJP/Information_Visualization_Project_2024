<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/7/7a/MyAnimeList_Logo.png">
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script type="text/javascript" src="libs/d3-simple-slider.min.js"></script>
    <title>MyAnimeList Dashboard</title>
  </head>
  <body onload="init()">
    <div class="container">
      <div id="FilterContainer">
        <div id="logo_container">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/58/MyAnimeList_-_Full_Text_Logo.jpg/2560px-MyAnimeList_-_Full_Text_Logo.jpg">
        </div>
        <div id="search_box_container">
          <img src="https://static-00.iconduck.com/assets.00/search-icon-2044x2048-psdrpqwp.png">
          <span><input type="text" id="search_box" placeholder="Search for anime..." oninput="createAnimeList()"></span>
        </div>
        <div id="anime_list"></div>
        <div id="anime_list_scale">
          <div id="anime_list_scale_left"></div><div id="anime_list_scale_label" style="font-size: 12px;"><b>Number of Episodes</b></div><div id="anime_list_scale_right"></div>
        </div>
        <div id='season_filter'>
          Seasons
          <div id='season_buttons_container'>
            <div class='season_button' id='winter_button' onclick="clickSeason('Winter');">Winter ❄</div>
            <div class='season_button' id='spring_button' onclick="clickSeason('Spring');">Spring ✿</div>
            <div class='season_button' id='summer_button' onclick="clickSeason('Summer');">Summer ☀</div>
            <div class='season_button' id='fall_button' onclick="clickSeason('Fall');">Fall ☂︎</div>
          </div>
        </div>
        <div id='popularity_filter'>
          Popularity
          <div class="slider-holder" id="pop_slider_container"></div>
        </div>
        <div id='score_filter'>
          Score
          <div class="slider-holder" id="score_slider_container"></div>
        </div>
        <div id='genre_filter'>
          Genre<br>
          <select name="genre_select" id="genre_select" onchange="clickGenre()"></select>
        </div>
        <div id='source_filter'>
          Source<br>
          <select name="source_select" id="source_select" onchange="clickSource()"></select>
        </div>
        <button class="scatter_plot_button" id="filter_reset_button" onclick="resetFilters()">Reset All Filters</button>
      </div>
      <div class="graph_container" id="ScentedPlot"></div>
      <div class="graph_container" id="Sunburst"></div>
      <div class="graph_container" id="Histogram"></div>
      <div class="graph_container" id="ScatterPlot">
        <div id="scatter_plot_info">
          <button class="scatter_plot_button" id="individual_selection_reset_button" onclick="resetIndividualSelection()">Reset Selection</button>
          <button class="scatter_plot_button" id="zoom_reset_button" onclick="resetScatterPlotZoom()">Reset Zoom</button>
          <div id="slope_value"></div>
        </div>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
